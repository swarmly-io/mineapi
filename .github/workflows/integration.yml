name: Minecraft integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose -f test/docker-compose.integration.yml up -d --wait
      - run: npm run test:integration
      - if: always()
        run: docker compose -f test/docker-compose.integration.yml logs
      - if: always()
        run: docker compose -f test/docker-compose.integration.yml down -v
