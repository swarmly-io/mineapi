services:
  minecraft:
    image: itzg/minecraft-server:java17
    environment:
      EULA: "TRUE"
      TYPE: VANILLA
      VERSION: 1.17.1
      LEVEL_TYPE: FLAT
      ONLINE_MODE: "FALSE"
      OPS: MineApiIntegration
      ENABLE_RCON: "true"
      RCON_PASSWORD: integration-test-password
      DIFFICULTY: easy
      SPAWN_PROTECTION: 0
    ports:
      - "25565:25565"
      - "25575:25575"
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 30
